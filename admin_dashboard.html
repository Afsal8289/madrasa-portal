<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madrasa Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f0f4f8; margin: 0; padding: 15px; }
        .header { background-color: #2980b9; color: white; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h2 { margin: 0; font-size: 20px; }
        .header p { margin: 0; font-size: 14px; opacity: 0.9; }
        .logout-btn { background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;}
        
        .container { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        @media (min-width: 768px) { .container { flex-direction: row; } .form-section { flex: 1; } .list-section { flex: 2; } }
        
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .card h3 { margin-top: 0; color: #2c3e50; font-size: 18px; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px;}
        input, select { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        button.action-btn { background-color: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-size: 15px; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; min-width: 500px; }
        .table-responsive { overflow-x: auto; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #f8f9fa; color: #333; }

        .class-tags-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .class-tag { background: #e8f4f8; border: 1px solid #bce8f1; padding: 5px 12px; border-radius: 20px; font-size: 13px; display: flex; align-items: center; gap: 8px; color: #2c3e50; font-weight: 600; }
        .subject-tag { background: #fcf3cf; border: 1px solid #f7dc6f; padding: 5px 12px; border-radius: 20px; font-size: 13px; display: flex; align-items: center; gap: 8px; color: #7d6608; font-weight: 600; }
        .tag-close { color: white; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 12px; font-weight: bold; }
        .class-close { background: #e74c3c; }
        .subject-close { background: #e67e22; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>Admin Dashboard</h2>
            <p id="madrasaNameDisplay">Loading...</p> 
        </div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

    <div class="container">
        
        <div class="form-section">
            <!-- 1. Manage Classes Section -->
            <div class="card" style="margin-bottom: 20px;">
                <h3>Manage Classes</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="newClassName" placeholder="e.g., Class 1 A" style="margin: 0;">
                    <button class="action-btn" id="addClassBtn" style="width: auto; padding: 10px 20px;">Add</button>
                </div>
                <div class="class-tags-container" id="classListContainer" style="margin-top: 15px;">
                    <span style="color: #888; font-size: 13px;">Loading classes...</span>
                </div>
            </div>

            <!-- 2. Manage Subjects Section -->
            <div class="card" style="margin-bottom: 20px;">
                <h3>Manage Subjects</h3>
                <p style="font-size: 12px; color: #666; margin-top:0;">Add subjects specific to each class.</p>
                
                <label style="font-size: 13px; color: #555; font-weight: 600;">Select Class:</label>
                <select id="subjectClassSelect" style="margin-bottom: 10px;">
                    <option value="">Select a class first</option>
                </select>

                <div style="display: flex; gap: 10px;">
                    <input type="text" id="newSubjectName" placeholder="Subject Name (e.g., Quran)" style="margin: 0;" disabled>
                    <button class="action-btn" id="addSubjectBtn" style="width: auto; padding: 10px 20px; background-color: #f39c12;" disabled>Add</button>
                </div>
                
                <p style="font-size: 13px; color: #2c3e50; margin-top: 15px; margin-bottom: 5px;"><b>Added Subjects:</b></p>
                <div class="class-tags-container" id="subjectListContainer">
                    <span style="color: #888; font-size: 13px;">Subjects will appear here when you select a class above...</span>
                </div>
            </div>

            <!-- 3. Add Teacher Section -->
            <div class="card">
                <h3>Add New Teacher</h3>
                <input type="text" id="tName" placeholder="Teacher Name">
                <input type="email" id="tEmail" placeholder="Teacher Email (Login ID)">
                <input type="text" id="tPassword" placeholder="Create Password">
                
                <label style="font-size: 13px; color: #555;">Assign Class</label>
                <select id="tClass">
                    <option value="">Loading Classes...</option>
                </select>
                
                <button class="action-btn" id="createTeacherBtn">Add Teacher</button>
            </div>
        </div>

        <!-- Teachers List Section -->
        <div class="card list-section">
            <h3>Teachers List</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Class Assigned</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="teacherTableBody">
                        <tr><td colspan="4" style="text-align: center;">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script type="module" src="admin_dashboard.js"></script>
</body>
</html>
