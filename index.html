<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madrasa Portal - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ലോഗിൻ ടാബുകൾക്കുള്ള ഡിസൈൻ */
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #e2e8f0; border-radius: 8px; cursor: pointer; font-weight: 600; color: #64748b; font-family: 'Poppins', sans-serif; transition: 0.3s; }
        .tab-btn.active { background: #2c3e50; color: white; }
        .login-form { display: flex; flex-direction: column; gap: 15px; }
        .input-group { position: relative; width: 100%; }
        .input-group input { width: 100%; padding: 12px; padding-right: 40px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-family: 'Poppins', sans-serif; font-size: 14px; }
        .input-group input:focus { outline: none; border-color: #3498db; }
        button[id^="login"] { background: #3498db; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Poppins', sans-serif; font-size: 15px; transition: 0.3s; }
        button[id^="login"]:hover { background: #2980b9; }
        .hidden { display: none !important; }
        
        /* കണ്ണ് ഐക്കൺ ഡിസൈൻ */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            color: #64748b;
            user-select: none;
            transition: 0.3s;
        }
        .toggle-password:hover { color: #2c3e50; }
    </style>
</head>
<body>

    <div class="login-container" style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; margin: auto; margin-top: 50px; text-align: center;">
        <h2 style="margin-top: 0; color: #2c3e50;">Madrasa Portal</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Please select your role to log in</p>
        
        <div class="tab-container">
            <button class="tab-btn active" id="tabTeacher">Teacher</button>
            <button class="tab-btn" id="tabAdmin">Admin</button>
        </div>

        <div id="teacherForm" class="login-form">
            <div class="input-group">
                <input type="email" id="tEmail" placeholder="Teacher Email" required>
            </div>
            <div class="input-group">
                <input type="text" id="tClass" placeholder="Class / Division (e.g. 10 or 10A)" required>
            </div>
            <div class="input-group">
                <input type="password" id="tPassword" placeholder="Password" required>
                <i class="fas fa-eye toggle-password" onclick="togglePassword('tPassword', this)"></i>
            </div>
            <button id="loginTeacherBtn">Login as Teacher</button>
        </div>

        <div id="adminForm" class="login-form hidden">
            <div class="input-group">
                <input type="email" id="email" placeholder="Admin Email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
                <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
            </div>
            <button id="loginAdminBtn">Login as Admin</button>
        </div>
        
        <p id="errorMessage" style="color: #e74c3c; font-size: 13px; margin-top: 15px; font-weight: 600;"></p>
    </div>

    <script>
        const tabTeacher = document.getElementById('tabTeacher');
        const tabAdmin = document.getElementById('tabAdmin');
        const teacherForm = document.getElementById('teacherForm');
        const adminForm = document.getElementById('adminForm');
        const errorMsg = document.getElementById('errorMessage');

        tabTeacher.addEventListener('click', () => {
            tabTeacher.classList.add('active'); tabAdmin.classList.remove('active');
            teacherForm.classList.remove('hidden'); adminForm.classList.add('hidden');
            errorMsg.innerText = '';
        });

        tabAdmin.addEventListener('click', () => {
            tabAdmin.classList.add('active'); tabTeacher.classList.remove('active');
            adminForm.classList.remove('hidden'); teacherForm.classList.add('hidden');
            errorMsg.innerText = '';
        });

        // പാസ്‌വേർഡ് കാണാനും മറയ്ക്കാനുമുള്ള ഫംഗ്ഷൻ (ഐക്കൺ മാറുന്ന രീതി)
        function togglePassword(inputId, iconElement) {
            const inputField = document.getElementById(inputId);
            if (inputField.type === "password") {
                inputField.type = "text";
                iconElement.classList.remove("fa-eye");
                iconElement.classList.add("fa-eye-slash"); 
            } else {
                inputField.type = "password";
                iconElement.classList.remove("fa-eye-slash");
                iconElement.classList.add("fa-eye");
            }
        }

        // ലോഗിൻ ചെയ്യുമ്പോൾ പഴയ മെമ്മറികൾ ക്ലിയർ ചെയ്യാനുള്ള കോഡ്
        document.getElementById('loginTeacherBtn').addEventListener('click', function() {
            localStorage.clear();
            sessionStorage.clear();
        });

        document.getElementById('loginAdminBtn').addEventListener('click', function() {
            localStorage.clear();
            sessionStorage.clear();
        });
    </script>
    
    <script type="module" src="app.js"></script>

</body>
</html>
