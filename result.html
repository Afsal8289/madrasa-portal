<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f1f5f9; color: #334155; }
        .result-container { max-width: 650px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header-text { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; }
        .header-text h2 { color: #0f172a; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; font-size: 24px; }
        .header-text p { color: #64748b; margin: 0; font-weight: 500;}
        
        .form-group { margin-bottom: 20px; }
        .form-group label { font-weight: 500; color: #475569; margin-bottom: 8px; display: block; font-size: 14px;}
        .form-control { border-radius: 8px; padding: 12px; border: 1px solid #cbd5e1; background-color: #f8fafc; font-size: 15px;}
        .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .btn-submit { background-color: #3b82f6; color: white; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; border: none; font-size: 16px; transition: all 0.2s; margin-top: 10px;}
        .btn-submit:hover { background-color: #2563eb; }
        
        #resultCard { display: none; margin-top: 30px; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
        .student-info { background-color: #f8fafc; padding: 15px; border-bottom: 1px solid #e2e8f0; display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between;}
        .student-info p { margin: 0; font-size: 14px; color: #475569;}
        .student-info span { font-weight: 700; color: #0f172a; font-size: 15px;}
        
        .marks-table { width: 100%; border-collapse: collapse; }
        .marks-table th, .marks-table td { padding: 12px 15px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        .marks-table th { background-color: #f1f5f9; font-weight: 600; color: #475569; font-size: 14px;}
        
        .summary-box { display: flex; justify-content: space-between; background-color: #0f172a; color: white; padding: 15px; text-align: center; flex-wrap: wrap; gap: 10px;}
        .summary-item { flex: 1; min-width: 80px;}
        .summary-item h4 { margin: 0; font-size: 22px; font-weight: 700; }
        .summary-item p { margin: 0; font-size: 12px; opacity: 0.8; text-transform: uppercase; }
        
        .status-passed { color: #16a34a; font-weight: bold; }
        .status-failed { color: #dc2626; font-weight: bold; }
        
        .error-msg { display: none; color: #dc2626; background: #fee2e2; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; border: 1px solid #fecaca; }
    </style>
</head>
<body>

    <div class="result-container">
        <div class="header-text">
            <h2 id="madrasaNameDisplay">Loading...</h2>
            <p>Madrasa Result Portal</p>
        </div>

        <div id="searchSection">
            <form id="resultForm">
                <div class="row">
                    <div class="col-md-6 form-group">
                        <label>Select Exam Term</label>
                        <select id="examTerm" class="form-control" required>
                            <option value="Monthly Test">Monthly Test</option>
                            <option value="Quarterly Exam">Quarterly Exam</option>
                            <option value="Half Yearly Exam">Half Yearly Exam</option>
                            <option value="Annual Exam">Annual Exam</option>
                        </select>
                    </div>
                    <div class="col-md-6 form-group">
                        <label>Select Class</label>
                        <select id="className" class="form-control" required>
                            <option value="">Loading Classes...</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 form-group">
                        <label>Gender</label>
                        <select id="gender" class="form-control" required>
                            <option value="Male">Boy (Male)</option>
                            <option value="Female">Girl (Female)</option>
                        </select>
                    </div>
                    <div class="col-md-6 form-group">
                        <label>Roll Number</label>
                        <input type="number" id="rollNo" class="form-control" placeholder="e.g. 1" min="1" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="searchBtn">View Result</button>
            </form>
            <div class="error-msg" id="errorMsg"></div>
        </div>

        <!-- Result Display Area -->
        <div id="resultCard">
            <div class="student-info">
                <div><p>Name:</p><span id="resName"></span></div>
                <div><p>Class:</p><span id="resClass"></span></div>
                <div><p>Roll No:</p><span id="resRollNo"></span></div>
                <div><p>Exam:</p><span id="resTerm"></span></div>
            </div>
            <table class="marks-table">
                <thead>
                    <tr><th>Subject</th><th>Max Mark</th><th>Obtained</th></tr>
                </thead>
                <tbody id="marksBody">
                    <!-- Marks will load here -->
                </tbody>
            </table>
            <div class="summary-box">
                <div class="summary-item">
                    <p>Total</p>
                    <h4 id="resTotal">0/0</h4>
                </div>
                <div class="summary-item">
                    <p>Percentage</p>
                    <h4 id="resPerc">0%</h4>
                </div>
                <div class="summary-item">
                    <p>Grade</p>
                    <h4 id="resGrade">-</h4>
                </div>
                <div class="summary-item">
                    <p>Status</p>
                    <h4 id="resStatus">-</h4>
                </div>
            </div>
            <button class="btn btn-outline-secondary w-100 mt-3" style="border-radius: 0 0 8px 8px; border:none; border-top: 1px solid #e2e8f0; background: #f8fafc;" onclick="location.reload()">Search Another Result</button>
        </div>

    </div>

    <script type="module" src="result.js"></script>
</body>
</html>
