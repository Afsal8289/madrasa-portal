<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Control Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; }
        
        .header { background-color: #2c3e50; color: white; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h2 { margin: 0; font-size: 20px; }
        .logout-btn { background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;}
        
        .container { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        
        @media (min-width: 768px) {
            .top-cards { display: flex; gap: 20px; }
            .card { flex: 1; }
        }
        
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #2980b9; font-size: 18px; margin-bottom: 15px;}
        
        input { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; font-family: 'Poppins', sans-serif;}
        input:focus { outline: none; border-color: #3498db; }
        
        button.action-btn { background-color: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.3s;}
        button.update-btn { background-color: #f39c12; }
        button.btn-small { padding: 6px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; color: white; font-weight: bold; background-color: #3498db; }
        button.btn-small:hover { background-color: #2980b9; }
        
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; min-width: 800px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #f2f2f2; }
        
        .status-active { color: green; font-weight: bold; }
        .status-expired { color: red; font-weight: bold; }

        /* Edit Modal Styles */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .modal-content h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #f0f4f8; padding-bottom: 10px; margin-bottom: 15px;}
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Super Admin Dashboard</h2>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

    <div class="container">
        
        <div class="top-cards">
            <div class="card">
                <h3>Add New Madrasa</h3>
                <input type="text" id="mName" placeholder="Madrasa Name">
                
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="mId" placeholder="Madrasa ID (e.g. 1050)">
                    <input type="text" id="mPlace" placeholder="Place (e.g. Kerala)">
                </div>

                <input type="email" id="mEmail" placeholder="Admin Email (e.g. admin@hidaya.com)">
                <input type="text" id="mPassword" placeholder="Create a password">
                
                <label style="font-size: 13px; color: #555;">Expiry Date (Optional)</label>
                <input type="date" id="mExpiryDate">
                
                <button class="action-btn" id="createMadrasaBtn">Create Account</button>
            </div>

            <div class="card">
                <h3>Global Expiry Update</h3>
                <p style="font-size: 13px; color: #666; margin-top: 0;">എല്ലാ മദ്രസകളുടെയും കാലാവധി ഒന്നിച്ച് പുതുക്കുക.</p>
                
                <label style="font-size: 13px; color: #555;">New Global Expiry Date</label>
                <input type="date" id="globalExpiryDate">
                
                <button class="action-btn update-btn" id="updateGlobalBtn">Update All Madrasas</button>
            </div>
        </div>

        <div class="card">
            <h3>Registered Madrasas</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Madrasa Name</th>
                            <th>Place</th>
                            <th>Email Address</th>
                            <th>Expiry Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="madrasaTableBody">
                        <tr>
                            <td colspan="7" style="text-align: center;">Loading data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div id="editModal" class="modal hidden">
        <div class="modal-content">
            <h3>Edit Madrasa Details</h3>
            <input type="hidden" id="editUid">
            
            <label style="font-size: 12px; font-weight: bold; color: #666;">Madrasa Name</label>
            <input type="text" id="editName">
            
            <label style="font-size: 12px; font-weight: bold; color: #666;">Madrasa ID</label>
            <input type="text" id="editId">
            
            <label style="font-size: 12px; font-weight: bold; color: #666;">Place</label>
            <input type="text" id="editPlace">
            
            <label style="font-size: 12px; font-weight: bold; color: #666;">Expiry Date</label>
            <input type="date" id="editExpiry">
            
            <div style="display:flex; gap:10px; margin-top: 10px;">
                <button class="action-btn" id="saveEditBtn">Save Changes</button>
                <button class="action-btn" style="background:#e74c3c;" onclick="document.getElementById('editModal').classList.add('hidden')">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="super_admin.js"></script>

</body>
</html>
