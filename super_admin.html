<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Control Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; }
        
        .header { background-color: #2c3e50; color: white; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h2 { margin: 0; font-size: 20px; }
        .logout-btn { background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        
        .container { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        
        @media (min-width: 768px) {
            .top-cards { display: flex; gap: 20px; }
            .card { flex: 1; }
        }
        
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #2980b9; font-size: 18px; margin-bottom: 15px;}
        
        input { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        
        button.action-btn { background-color: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-size: 15px; font-weight: bold; }
        button.update-btn { background-color: #f39c12; }
        
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; min-width: 600px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #f2f2f2; }
        
        .status-active { color: green; font-weight: bold; }
        .status-expired { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Super Admin Dashboard</h2>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

    <div class="container">
        
        <div class="top-cards">
            <!-- 1. പുതിയ മദ്രസ ചേർക്കാനുള്ള ഫോം -->
            <div class="card">
                <h3>Add New Madrasa</h3>
                <input type="text" id="mName" placeholder="Madrasa Name">
                <input type="email" id="mEmail" placeholder="Admin Email (e.g. m1@madrasa.com)">
                <input type="text" id="mPassword" placeholder="Create a password">
                
                <label style="font-size: 13px; color: #555;">Expiry Date (Optional - പിന്നീട് നൽകാം)</label>
                <input type="date" id="mExpiryDate">
                
                <button class="action-btn" id="createMadrasaBtn">Create Account</button>
            </div>

            <!-- 2. മൊത്തത്തിൽ തിയ്യതി മാറ്റാനുള്ള ഭാഗം -->
            <div class="card">
                <h3>Global Expiry Update</h3>
                <p style="font-size: 13px; color: #666; margin-top: 0;">എല്ലാ മദ്രസകളുടെയും കാലാവധി ഒന്നിച്ച് പുതുക്കുക.</p>
                
                <label style="font-size: 13px; color: #555;">New Global Expiry Date</label>
                <input type="date" id="globalExpiryDate">
                
                <button class="action-btn update-btn" id="updateGlobalBtn">Update All Madrasas</button>
            </div>
        </div>

        <!-- 3. മദ്രസകളുടെ ലിസ്റ്റ് -->
        <div class="card">
            <h3>Registered Madrasas</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Madrasa Name</th>
                            <th>Email Address</th>
                            <th>Expiry Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="madrasaTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center;">No Madrasas added yet...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- ശ്രദ്ധിക്കുക: ഇതാണ് നമ്മൾ js ഫയലുമായി ബന്ധിപ്പിക്കുന്ന വരി -->
    <script type="module" src="super_admin.js"></script>

</body>
</html>
